<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- Circular Badge -->
  <g transform="translate(4, 4)">
    <!-- Dark Circle Background -->
    <circle cx="20" cy="20" r="18.5" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- House Roof -->
    <path d="M12 21.5 L20 14 L28 21.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- House Body -->
    <path d="M14.5 20.5 V27 C14.5 27.5 15 28 15.5 28 H24.5 C25 28 25.5 27.5 25.5 27 V20.5" fill="#ffffff"/>
    
    <!-- Emerald Door -->
    <rect x="18.5" y="22" width="3" height="6" rx="0.5" fill="#10b981"/>
  </g>

  <!-- Typography: Kosify -->
  <text x="56" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">Kosify</text>
  
  <!-- Emerald Dot Accent -->
  <circle cx="132" cy="30" r="3" fill="#10b981"/>
</svg>
